# Upptime configuration for the public status page of florianhemery.fr.
# Checks run from GitHub Actions every 5 minutes, outside the production server.
owner: florianhemery
repo: status

sites:
  - name: Site
    url: https://florianhemery.fr
  - name: Assistant (API)
    url: https://florianhemery.fr/api/v1/health
    expectedStatusCodes:
      - 200
  - name: Technique
    url: https://florianhemery.fr/technique

assignees:
  - florianhemery

status-website:
  baseUrl: /status
  logoUrl: https://florianhemery.fr/favicon.ico
  name: État de florianhemery.fr
  introTitle: "État du site et de l'assistant"
  introMessage: "Vérification toutes les 5 minutes, depuis un serveur indépendant du site."
  navbar:
    - title: État
      href: /
    - title: Le site
      href: https://florianhemery.fr

commitMessages:
  readmeContent: ":pencil: Update summary in README"
  summaryJob: ":card_file_box: Update status summary"
  statusChange: "$EMOJI $SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms)"
